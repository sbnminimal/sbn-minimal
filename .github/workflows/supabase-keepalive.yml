name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 * * *'   # 9:00 am Argentina (UTC-3)
    - cron: '0 21 * * *'   # 18:00 pm Argentina (UTC-3)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Generar actividad real en Supabase (GET + upserts, con reintentos)
        run: |
          # ══════════════════════════════════════════════════════════════════
          # MODO PRUEBA: descomentá la siguiente línea para forzar un fallo
          # y probar que el mail de aviso llegue bien. Volvé a comentarla
          # (agregar el # adelante) para que el chequeo real funcione de nuevo.
          # ══════════════════════════════════════════════════════════════════
          # echo "🧪 Modo prueba activado: forzando fallo a propósito"; exit 1

          MAX_INTENTOS=3
          ESPERA_SEGUNDOS=20
          AHORA=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)

          # ---------- función genérica con reintentos ----------
          # uso: intentar "descripción" comando_curl...
          intentar() {
            local DESCRIPCION="$1"; shift
            for intento in $(seq 1 $MAX_INTENTOS); do
              echo "== $DESCRIPCION (intento $intento de $MAX_INTENTOS) =="
              STATUS=$("$@")
              echo "HTTP status: $STATUS"
              if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
                echo "✅ $DESCRIPCION OK (intento $intento)."
                return 0
              fi
              echo "⚠️  Falló el intento $intento de: $DESCRIPCION"
              if [ "$intento" -lt "$MAX_INTENTOS" ]; then
                echo "Esperando ${ESPERA_SEGUNDOS}s antes de reintentar..."
                sleep $ESPERA_SEGUNDOS
              fi
            done
            echo "❌ $DESCRIPCION: los $MAX_INTENTOS intentos fallaron."
            return 1
          }

          # ---------- paso 1: GET de lectura ----------
          hacer_get() {
            curl -s -o /tmp/get_resp.json -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/producto?select=id_producto&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          }
          intentar "GET de lectura" hacer_get || exit 1
          cat /tmp/get_resp.json; echo ""

          # ---------- paso 2: PATCH en config (clave dedicada, ya creada a mano) ----------
          hacer_patch_config() {
            curl -s -o /tmp/config_resp.json -w "%{http_code}" \
              -X PATCH "$SUPABASE_URL/rest/v1/config?clave=eq.keepalive_ping" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d "{\"valor\":\"$AHORA\"}"
          }
          intentar "PATCH en config.keepalive_ping" hacer_patch_config || exit 1
          cat /tmp/config_resp.json; echo ""

          # ---------- paso 3: upsert en producto (fila dedicada, oculta) ----------
          hacer_upsert_producto() {
            curl -s -o /tmp/producto_resp.json -w "%{http_code}" \
              -X POST "$SUPABASE_URL/rest/v1/producto?on_conflict=id_producto" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              -d "{\"id_producto\":\"KEEPALIVE-TEST\",\"nombre_variante\":\"No tocar - uso interno\",\"categoria\":\"zzz-interno\",\"precio_venta\":0,\"activo\":false,\"stock_minimo\":0,\"descripcion_web\":\"Fila de uso interno para mantener activo Supabase. Último ping: $AHORA\"}"
          }
          intentar "Upsert en producto.KEEPALIVE-TEST" hacer_upsert_producto || exit 1
          cat /tmp/producto_resp.json; echo ""

          echo "✅ Keep-alive completo: GET + upsert config + upsert producto, todo OK."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Avisar por mail si falló
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: SBN Keep-Alive <${{ secrets.GMAIL_USER }}>
          to: ${{ secrets.GMAIL_USER }}
          subject: "🚨⚠️ ALERTA: falló la verificación del sitio SBN ⚠️🚨"
          body: |
            El workflow "Supabase Keep-Alive" falló después de los reintentos.

            Repo: ${{ github.repository }}
            Corrida: ${{ github.run_id }}

            Es probable que el proyecto de Supabase se haya pausado o esté teniendo
            problemas de conexión. Entrá al dashboard de Supabase y revisá si hace
            falta reactivarlo manualmente:
            https://supabase.com/dashboard/project/mpdrpzhziibnafdjdqdb

            Ver el log completo de esta corrida:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
